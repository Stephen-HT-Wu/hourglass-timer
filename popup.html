<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #f0c27f;
      --accent-dark: #e8a850;
      --accent-glow: rgba(240, 194, 127, 0.3);
      --accent-border: rgba(240, 194, 127, 0.3);
      --accent-bg: rgba(240, 194, 127, 0.15);
      --accent-bg-active: rgba(240, 194, 127, 0.2);
    }

    body.theme-blue {
      --accent: #00e5ff;
      --accent-dark: #00b0d4;
      --accent-glow: rgba(0, 229, 255, 0.35);
      --accent-border: rgba(0, 229, 255, 0.3);
      --accent-bg: rgba(0, 229, 255, 0.15);
      --accent-bg-active: rgba(0, 229, 255, 0.25);
    }

    body.theme-green {
      --accent: #39ff14;
      --accent-dark: #2bc70e;
      --accent-glow: rgba(57, 255, 20, 0.35);
      --accent-border: rgba(57, 255, 20, 0.3);
      --accent-bg: rgba(57, 255, 20, 0.15);
      --accent-bg-active: rgba(57, 255, 20, 0.25);
    }

    body {
      width: 280px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      width: 100%;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .theme-switcher {
      display: flex;
      gap: 6px;
    }

    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
      background: none;
      appearance: none;
    }

    .theme-dot:hover {
      transform: scale(1.2);
    }

    .theme-dot.active {
      border-color: #fff;
      box-shadow: 0 0 6px currentColor;
    }

    .theme-dot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-dot.dot-gold { background: #f0c27f; color: #f0c27f; }
    .theme-dot.dot-blue { background: #00e5ff; color: #00e5ff; }
    .theme-dot.dot-green { background: #39ff14; color: #39ff14; }

    .hourglass-container {
      position: relative;
      width: 120px;
      height: 200px;
      margin: 10px 0 20px;
    }

    canvas {
      width: 120px;
      height: 200px;
    }

    .time-display {
      font-size: 36px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      margin-bottom: 20px;
      letter-spacing: 2px;
      transition: opacity 0.3s;
    }

    @keyframes completePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .time-display.complete {
      animation: completePulse 1s ease-in-out 5;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 16px;
    }

    .preset-btn {
      padding: 8px 4px;
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover:not(:disabled) {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .preset-btn.active {
      background: var(--accent-bg-active);
      border-color: var(--accent);
      color: var(--accent);
    }

    .preset-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .preset-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .custom-input {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .custom-input input {
      width: 60px;
      padding: 6px 8px;
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-size: 14px;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }

    .custom-input input:focus-visible {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .custom-input input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .custom-input label {
      font-size: 12px;
      color: #b0b0b0;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #1a1a2e;
    }

    .btn-start:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-stop {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-stop:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .mute-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #b0b0b0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .mute-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #e0e0e0;
    }

    .mute-btn.muted {
      color: #666;
    }

    .mute-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>HOURGLASS TIMER</h1>
    <div class="theme-switcher" role="group" aria-label="Color theme">
      <button class="theme-dot dot-gold active" data-theme="gold"
              aria-label="Gold theme" aria-pressed="true"></button>
      <button class="theme-dot dot-blue" data-theme="blue"
              aria-label="Blue theme" aria-pressed="false"></button>
      <button class="theme-dot dot-green" data-theme="green"
              aria-label="Green theme" aria-pressed="false"></button>
    </div>
  </div>

  <div class="hourglass-container">
    <canvas id="hourglass" width="240" height="400"
            role="img" aria-label="Hourglass: full"></canvas>
  </div>

  <div class="time-display" id="timeDisplay"
       role="timer" aria-label="Time remaining" aria-live="off">00:00</div>

  <div class="presets" role="group" aria-label="Preset durations">
    <button class="preset-btn" data-minutes="1">1 min</button>
    <button class="preset-btn" data-minutes="3">3 min</button>
    <button class="preset-btn active" data-minutes="5">5 min</button>
    <button class="preset-btn" data-minutes="10">10 min</button>
    <button class="preset-btn" data-minutes="15">15 min</button>
    <button class="preset-btn" data-minutes="25">25 min</button>
  </div>

  <div class="custom-input">
    <label for="customMin">Custom:</label>
    <input type="number" id="customMin" min="1" max="120" placeholder="min"
           aria-label="Custom duration in minutes">
    <span aria-hidden="true">min</span>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="startBtn">Start</button>
    <button class="btn btn-stop" id="resetBtn" disabled>Reset</button>
    <button class="mute-btn" id="muteBtn" aria-label="Mute alarm sound" title="Mute alarm">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
