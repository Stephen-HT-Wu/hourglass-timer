<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f0c27f;
      letter-spacing: 1px;
    }

    .hourglass-container {
      position: relative;
      width: 120px;
      height: 200px;
      margin: 10px 0 20px;
    }

    canvas {
      width: 120px;
      height: 200px;
    }

    .time-display {
      font-size: 36px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: #f0c27f;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 16px;
    }

    .preset-btn {
      padding: 8px 4px;
      border: 1px solid rgba(240, 194, 127, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: rgba(240, 194, 127, 0.15);
      border-color: #f0c27f;
      color: #f0c27f;
    }

    .preset-btn.active {
      background: rgba(240, 194, 127, 0.2);
      border-color: #f0c27f;
      color: #f0c27f;
    }

    .custom-input {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .custom-input input {
      width: 60px;
      padding: 6px 8px;
      border: 1px solid rgba(240, 194, 127, 0.3);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-size: 14px;
      text-align: center;
      outline: none;
    }

    .custom-input input:focus {
      border-color: #f0c27f;
    }

    .custom-input label {
      font-size: 12px;
      color: #999;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-start {
      background: linear-gradient(135deg, #f0c27f, #e8a850);
      color: #1a1a2e;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(240, 194, 127, 0.3);
    }

    .btn-stop {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-stop:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <h1>HOURGLASS TIMER</h1>

  <div class="hourglass-container">
    <canvas id="hourglass" width="240" height="400"></canvas>
  </div>

  <div class="time-display" id="timeDisplay">00:00</div>

  <div class="presets">
    <button class="preset-btn" data-minutes="1">1 min</button>
    <button class="preset-btn" data-minutes="3">3 min</button>
    <button class="preset-btn active" data-minutes="5">5 min</button>
    <button class="preset-btn" data-minutes="10">10 min</button>
    <button class="preset-btn" data-minutes="15">15 min</button>
    <button class="preset-btn" data-minutes="25">25 min</button>
  </div>

  <div class="custom-input">
    <label>Custom:</label>
    <input type="number" id="customMin" min="1" max="120" placeholder="min">
    <label>min</label>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="startBtn">Start</button>
    <button class="btn btn-stop" id="resetBtn">Reset</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
